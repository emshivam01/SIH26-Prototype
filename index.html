<html lang="en"><head><meta charset="utf-8">

<title>SkillNova</title>

<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Manrope,"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 2px}
.logo{font-weight:800;font-size:21px;letter-spacing:-.4px}.logo i{font-style:normal;color:var(--pr)}
.lang{display:flex;border:1px solid var(--bd);border-radius:99px;overflow:hidden}

.steps{display:flex;gap:4px;overflow-x:auto;padding:6px 0 8px}

.step b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--pl);color:var(--pr)}
.step[aria-selected=true]{background:var(--pl);color:var(--tx)}.step[aria-selected=true] b{background:var(--pr);color:var(--on)}

.hero{background:var(--hero);color:#fff;padding:26px 0 56px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}

.tr{display:grid;grid-template-columns:170px 1fr 1fr 1fr 90px;gap:10px;align-items:center;margin:10px 0;font-size:13px}
.th{color:var(--mu);font-weight:700;font-size:12px}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;text-align:center}
.tag.er{background:var(--erb)}.tag.wa{background:var(--wab)}.tag.ok{background:var(--okb)}
select{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
.btn{background:var(--pr);color:var(--on);border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn.gh{background:var(--pl);color:var(--pr)}.nx{display:flex;justify-content:flex-end;margin-top:4px}
.rec{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:8px}
.rec small{display:block;color:var(--mu)}.rec.y{border-color:var(--ok);background:var(--okb)}.rec.n{opacity:.5}
.grp{font-weight:800;font-size:13px;margin-top:18px;color:var(--pr)}
.ba{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:12px}.ba div{font-size:13px;color:var(--mu);text-align:center}
.note{font-size:12px;color:var(--mu);margin-top:8px}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px;margin:0;color:var(--tx)}.chk input{width:18px;height:18px;accent-color:var(--pr)}
.path{list-style:none;margin:8px 0 0 8px;padding:0;border-left:2px solid var(--bd)}
.path li{position:relative;padding:0 0 14px 20px}.path li:before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--ac)}
.path li.d:before{background:var(--ok)}.path small{display:block;color:var(--mu)}
input[type=range]{width:100%;accent-color:var(--pr)}
footer{text-align:center;color:var(--mu);font-size:12px;padding:0 0 28px}
svg text{font-family:inherit}
@media(max-width:760px){.g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.tr{grid-template-columns:110px 1fr 1fr 1fr}.tr>:last-child{display:none}.row{grid-template-columns:110px 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

 const hi=R.filter(n=>lvl(D[n])[0]=='HIGH').length,risk=R.filter(n=>align(n)<60).length,ups=R.reduce((a,n)=>a+D[n].rc.length,0);
 return `<div class="g4"><button class="kpi" data-go="1"><b>${hi}</b><span>${t('High-demand roles')}</span></button><button class="kpi" data-go="2"><b>${gaps.length}</b><span>${t('Skill gaps')}</span></button><button class="kpi" data-go="3"><b>${risk}</b><span>${t('Courses at risk')}</span></button><button class="kpi" data-go="3"><b>${ups}</b><span>${t('Curriculum updates')}</span></button></div>
 <div class="card"><h2>${t('Top emerging skills')}</h2><p class="h">${t('Ranked by gap between employer demand and course coverage.')}</p>${gaps.slice(0,5).map((g,i)=>`<div class="row"><b>${i+1}. ${g[0]}</b><span>${bar(g[1],'e')}<small class="note">${t(g[2])} · ${t('Gap')} ${g[1]}/10</small></span></div>`).join('')}</div>`},
()=>{const r=D[st.role],l=lvl(r),g=r.p-r.cap;
 return `<div class="card"><div class="g2"><div><label>${t('State')}</label><select><option>${t('Madhya Pradesh')}</option></select></div><div><label>${t('District')}</label><select><option>${t('Bhopal')}</option></select></div><div><label for="sc">${t('Sector')}</label><select id="sc" data-c="sec">${R.map(n=>`<option value="${D[n].sec}" ${D[n].sec==r.sec?'selected':''}>${t(D[n].sec)}</option>`).join('')}</select></div><div><label for="rl">${t('Role')}</label><select id="rl" data-c="role">${opt(R,st.role)}</select></div></div></div>
 <div class="g2"><div class="card"><h2>${t('Demand')}: <span class="${l[1]}">${t(l[0])} ${l[2]}</span></h2><p class="h">${t(st.role)}, ${t('Bhopal')}</p>
 <div class="stat"><span>${t('Job postings')}<small>${t('last 90 days')}</small></span><b>${r.p}</b></div><div class="stat"><span>${t('Demand growth')}<small>${t('vs previous 6 months')}</small></span><b class="ok">+${r.g}%</b></div><div class="stat"><span>${t('Training capacity')}<small>${t('seats per year')}</small></span><b>${r.cap}</b></div><div class="stat"><span>${t('Estimated gap')}<small>${t('postings minus seats')}</small></span><b class="er">${g}</b></div></div>
 <div class="card"><h2>${t('Required skills')}</h2><p class="h">${t('Employer demand, scored 0 to 10 from posting frequency.')}</p>${[...r.sk].sort((a,b)=>b[1]-a[1]).map(k=>`<div class="row"><span>${k[0]}</span>${bar(k[1])}</div>`).join('')}</div></div>
 <div class="g2"><div class="card"><h2>${t('Openings trend')}</h2><p class="h">${t('last 90 days')} · 6 ${lang=='hi'?'अवधि':'periods'}</p>${spark(r.tr)}</div>
 <div class="card"><h2>${t('Market snapshot')}</h2><div class="stat"><span>${t('Salary range')}</span><b>${r.sal}</b></div><div class="stat"><span>${t('Top hiring employers')}</span><small style="max-width:60%;text-align:right">${r.emp}</small></div></div></div>`},
()=>{const r=D[st.role],ks=[...r.sk].sort((a,b)=>gp(b)-gp(a)),a=align(st.role);
 return rs(st.role)+`<div class="card"><h2>${t(st.role)}</h2><div class="ba" style="justify-content:flex-start;margin:6px 0 12px">${ring(a,a<60?'er':'ok')}<div style="text-align:left"><b style="color:var(--tx)">${t('Alignment today')}</b><br>${t('Feeder course')}: ${r.course}</div></div><p class="h">${t('Gap = demand minus course coverage, largest first.')}</p><div class="tr th"><span>${t('Skill gaps')}</span><span>${t('Demand')}</span><span>${t('Course coverage')}</span><span>${t('Gap')}</span><span></span></div>
 ${ks.map(k=>{const g=gp(k),s=sev(g);return `<div class="tr"><b>${k[0]}</b>${bar(k[1])}${bar(k[2],'a')}${bar(g,'e')}<span class="tag ${s[1]}">${t(s[0])}</span></div>`}).join('')}</div>
 <div class="card"><h2>${t('Identified gaps')}</h2>${ks.filter(k=>gp(k)>=3).map(k=>{const s=sev(gp(k));return `<div class="stat"><span>${s[1]=='er'?'🔴':'🟡'} ${k[0]}</span><b class="${s[1]}">${t(s[0])} · ${t('Gap')} ${gp(k)}</b></div>`}).join('')}</div>`},
()=>{const r=D[st.role],n=st.role,ic={ADD:'+',UPDATE:'↻',REDUCE:'↓',EQUIPMENT:'+',TRAINER:'→'},b=align(n),f=align(n,1);
 return rs(n)+`<div class="card"><h2>${r.course}</h2><div class="ba" style="justify-content:flex-start">${ring(b,'er')}<div><b style="color:var(--tx)">${t('Alignment today')}</b></div><span class="big">→</span>${ring(f,f>=b?'ok':'er')}<div><b style="color:var(--tx)">${t('After approved changes')}</b></div><button class="btn gh" data-all="1">${t('Approve all')}</button></div></div>
 <div class="card"><h2>${t('Recommended curriculum changes')}</h2><p class="h">${t('An expert approves or rejects each change.')}</p>
 ${['ADD','UPDATE','REDUCE','EQUIPMENT','TRAINER'].map(T=>{const it=r.rc.map((q,i)=>[q,i]).filter(x=>x[0][0]==T);if(!it.length)return'';return `<div class="grp">${t(T[0]+T.slice(1).toLowerCase())}</div>`+it.map(([q,i])=>{const k=q[2]&&r.sk.find(z=>z[0]==q[2]),ev=k?`${t('Asked in')} ${k[1]*10}% ${t('of postings')} · ${t('coverage')} ${k[2]*10}%`:q[3],s=st.ap[n+i]||'';return `<div class="rec ${s}"><div><b>${ic[T]} ${q[1]}</b><small>${ev}</small></div><div>${s?`<b class="${s=='y'?'ok':'er'}">${t(s=='y'?'Approved':'Rejected')}</b>`:`<button class="btn" data-ap="${n+i}" data-v="y">${t('Approve')}</button> <button class="btn gh" data-ap="${n+i}" data-v="n">${t('Reject')}</button>`}</div></div>`}).join('')}).join('')}</div>`},
()=>{const r=D[st.role],g=r.p-r.cap,x=Math.min(st.seats,g),b=Math.ceil(x/40),k=Math.ceil(b/2),tr=x?b+1:0,l=lvl(r);
 return rs(st.role)+`<div class="g2"><div class="card"><h2>${t('Bhopal')} · ${t(st.role)}</h2><div class="stat"><span>${t('Industry demand')}<small>${t('last 90 days')}</small></span><b>${r.p}</b></div><div class="stat"><span>${t('Current capacity')}<small>${t('seats per year')}</small></span><b>${r.cap}</b></div><div class="stat"><span>${t('Skill gap level')}</span><b class="${l[1]}">${t(l[0])} (${g})</b></div><div class="stat"><span>${t('Placement, last batch')}</span><b>62%</b></div></div>
 <div class="card"><h2>${t('Recommended action')}</h2><label for="sl" style="margin-top:8px">${t('Additional seats')}: <b>${x}</b> / ${g}</label><input id="sl" type="range" min="0" max="${g}" step="10" value="${x}" data-seat="1">
 <div class="stat"><span>+ ${b} ${t('training batches')}</span></div><div class="stat"><span>+ ${k} ${t('training kits')}</span></div><div class="stat"><span>+ ${tr} ${t('trainers to upskill')}</span></div><div class="stat"><span>+ ${x} ${t('Additional seats')}</span><b class="ok">${Math.round(100*x/g)}% ${t('of gap closed')}</b></div><div class="stat"><span>${t('Expected placements')}</span><b>~${Math.round(x*.62)}</b></div>
 <p class="note">${t('Assumptions: 40 seats per batch, 1 kit per 2 batches, 1 trainer per batch plus 1 lead.')}</p></div></div>`},
()=>{const r=D[st.role],ks=[...r.sk].sort((a,b)=>gp(b)-gp(a)),need=ks.filter(k=>!st.sel.has(k[0])),l=lvl(r);
 return rs(st.role)+`<div class="card"><h2>${t('Demand')}: <span class="${l[1]}">${t(l[0])} ${l[2]}</span></h2><p class="h">${r.p} ${t('openings in Bhopal')} · ${t('last 90 days')} · ${r.sal}</p></div>
 <div class="g2"><div class="card"><h2>${t('Tick the skills you already have')}</h2>${ks.map(k=>`<label class="chk"><input type="checkbox" data-sk="${k[0]}" ${st.sel.has(k[0])?'checked':''}>${k[0]}</label>`).join('')}</div>
 <div class="card"><h2>${t('Skills to develop')}</h2>${ks.map(k=>`<div class="stat"><span>${st.sel.has(k[0])?'✓':'⚠'} ${k[0]}</span><small>${st.sel.has(k[0])?t('You have it'):t('Priority')+': '+t(sev(gp(k))[0])}</small></div>`).join('')}</div></div>
 <div class="card"><h2>${t('Your career path')}</h2><ol class="path"><li class="d"><b>${t('Foundation')}</b></li>${need.map(k=>`<li><b>${k[0]}</b><small>40 h</small></li>`).join('')}<li><b>${t('Practical training')}</b><small>4 wk</small></li><li><b>${t('Certification')}</b><small>${r.cert}</small></li><li class="d"><b>${t(st.role)}</b><small>${r.p} ${t('openings in Bhopal')}</small></li></ol></div>`}];
function draw(){document.documentElement.lang=lang;document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l==lang));
 $('#steps').innerHTML=SC.map((s,i)=>`<button class="step ${i<st.i?'d':''}" aria-selected="${i==st.i}" data-go="${i}"><b>${i<st.i?'✓':i+1}</b>${t(s[0])}</button>`).join('');
 $('#hero').innerHTML=`<h1>${t(SC[st.i][1])}</h1><div class="chips"><span>${t(SC[st.i][2])}</span><span>${t('Bhopal, Madhya Pradesh')}</span></div>`;
 $('#app').innerHTML=S[st.i]()+(NX[st.i]?`<div class="nx"><button class="btn" data-go="${st.i+1}">${t(NX[st.i])} →</button></div>`:'');
 $('#ft').textContent=t('Sample data for demonstration')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const y=scrollY;
 if(b.dataset.l){lang=b.dataset.l;draw()}
 else if(b.dataset.go){st.i=+b.dataset.go;draw();scrollTo(0,0)}
 else if(b.dataset.ap){st.ap[b.dataset.ap]=b.dataset.v;draw();scrollTo(0,y)}
 else if(b.dataset.all){D[st.role].rc.forEach((q,i)=>st.ap[st.role+i]='y');draw()}});
document.addEventListener('change',e=>{const el=e.target,y=scrollY;
 if(el.dataset.c=='role'||el.dataset.c=='sec'){st.role=el.dataset.c=='role'?el.value:R.find(n=>D[n].sec==el.value);st.sel=new Set(D[st.role].sk.slice(0,2).map(k=>k[0]))}
 else if(el.dataset.sk){el.checked?st.sel.add(el.dataset.sk):st.sel.delete(el.dataset.sk)}else return;draw();scrollTo(0,y)});
document.addEventListener('input',e=>{if(e.target.dataset.seat){st.seats=+e.target.value;draw();$('#sl').focus()}});
draw();
</script></body></html>
